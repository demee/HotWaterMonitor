<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#172b41">
    <title>Hot Water Monitor</title>
    <style>
        :root {
            font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #20364d;
            background: #f0f5f8
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            padding-bottom: calc(64px + env(safe-area-inset-bottom))
        }

        .view[hidden] {
            display: none
        }

        .tabs {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            background: #172b41;
            box-shadow: 0 -2px 8px #14273a35;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 10
        }

        .tabs button {
            flex: 1;
            max-width: 460px;
            min-height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none;
            border: 0;
            color: #9fb3c6;
            font: 600 .8rem system-ui, -apple-system, "Segoe UI", sans-serif;
            cursor: pointer
        }

        .tabs button svg {
            width: 22px;
            height: 22px
        }

        .tabs button.active {
            color: #58a9f2
        }

        .log-tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: #52677b;
            font-size: .9rem;
            margin-bottom: 12px
        }

        .log-tools button {
            border: 1px solid #c9d8e3;
            background: #fff;
            color: #20364d;
            border-radius: 10px;
            padding: 8px 14px;
            font: inherit;
            cursor: pointer
        }

        .log-tools button:disabled {
            opacity: .5
        }

        #log-box {
            margin: 0;
            font: .78rem/1.45 ui-monospace, Consolas, monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            height: calc(100dvh - 260px);
            min-height: 240px;
            overflow: auto;
            background: #f6f9fb;
            border-radius: 12px;
            padding: 12px
        }

        .seg {
            display: flex;
            margin: 4px 0 10px;
            border: 1px solid #c9d8e3;
            border-radius: 10px;
            overflow: hidden;
            background: #fff
        }

        .seg button {
            flex: 1;
            min-height: 40px;
            border: 0;
            background: none;
            color: #20364d;
            font: 600 .85rem system-ui, -apple-system, "Segoe UI", sans-serif;
            cursor: pointer
        }

        .seg button+button {
            border-left: 1px solid #c9d8e3
        }

        .seg button.active {
            background: #58a9f2;
            color: #fff
        }

        #hist-chart {
            display: block;
            width: 100%;
            height: 240px
        }

        .hist-legend {
            display: flex;
            gap: 16px;
            font-size: .85rem;
            color: #52677b;
            margin-top: 8px
        }

        .hist-legend span::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 3px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: middle;
            background: currentColor
        }

        .bar {
            background: #172b41;
            color: #f5f8fc;
            padding: 14px max(20px, calc((100% - 920px)/2));
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 8px #14273a35
        }

        .bar svg {
            width: 39px;
            height: 45px;
            flex: none
        }

        .bar h1 {
            font-size: clamp(1.3rem, 4vw, 2rem);
            margin: 0;
            font-weight: 650;
            letter-spacing: .01em
        }

        .wrap {
            width: min(920px, 100% - 28px);
            margin: 24px auto
        }

        .card {
            background: #fff;
            border: 1px solid #e2ebf1;
            border-radius: 20px;
            padding: clamp(16px, 4vw, 30px);
            box-shadow: 0 8px 28px #19334a0b
        }

        .card h2 {
            font-size: 1.35rem;
            margin: 0 0 8px
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #52677b;
            font-size: .9rem;
            margin-bottom: 16px
        }

        .wstop, #water-rim { transition: stop-color 1.5s, stroke 1.5s }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #8796a4
        }

        .dot.ok {
            background: #16a36a;
            box-shadow: 0 0 0 3px #16a36a22
        }

        .dot.bad {
            background: #d14b45
        }

        .diagram {
            display: block;
            width: min(100%, 580px);
            height: auto;
            margin: 0 auto
        }

        .sensor {
            fill: #fff;
            stroke-width: 3
        }

        .readout {
            font: 700 25px system-ui, -apple-system, "Segoe UI", sans-serif
        }

        .label {
            font: 16px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: #43596e
        }

        .pipe-label {
            font: 15px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: #43596e
        }

        .foot {
            border-top: 1px solid #e8eef2;
            margin-top: 12px;
            padding-top: 14px;
            color: #63778a;
            font-size: .87rem;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap
        }

        @media(max-width:540px) {
            .wrap {
                width: calc(100% - 18px);
                margin: 12px auto
            }

            .card {
                padding: 14px 10px
            }

            .diagram {
                width: 100%
            }

            .foot {
                font-size: .8rem
            }
        }
    </style>
</head>

<body>
    <header class="bar"><svg viewBox="0 0 40 48" role="img" aria-label="Water drop">
            <path d="M20 2C15 12 4 23 4 32a16 16 0 0 0 32 0C36 23 25 12 20 2Z" fill="#58a9f2" />
            <path d="M12 33c0 4 3 8 7 9" fill="none" stroke="#1672c7" stroke-width="2" stroke-linecap="round" />
        </svg>
        <h1>Hot Water Monitor</h1>
    </header>
    <main class="wrap">
        <div id="view-tank" class="view">
        <section class="card" aria-labelledby="tank-title">
            <h2 id="tank-title">Tank</h2>
            <div class="status" role="status" aria-live="polite"><span class="dot" id="dot"></span><span
                    id="state">Connecting to ESP32…</span></div>
            <svg class="diagram" viewBox="0 0 520 660" role="img" aria-labelledby="diagram-title diagram-desc">
                <title id="diagram-title">Hot water tank and live sensor readings</title>
                <desc id="diagram-desc">Cutaway tank with hot water above cool water, an outlet at the top, and a feed
                    at the bottom.</desc>
                <defs>
                    <linearGradient id="water" x2="0" y2="1">
                        <stop class="wstop" stop-color="#1267df" offset="0" />
                        <stop class="wstop" stop-color="#1267df" offset=".33" />
                        <stop class="wstop" stop-color="#1267df" offset=".67" />
                        <stop class="wstop" stop-color="#1267df" offset="1" />
                    </linearGradient>
                    <linearGradient id="steel" x2="1">
                        <stop stop-color="#d9e0e5" />
                        <stop offset=".5" stop-color="#f6f8f9" />
                        <stop offset="1" stop-color="#d0d9df" />
                    </linearGradient>
                </defs>
                <!-- pipes -->
                <path d="M213 144v-35q0-31 31-31h104" fill="none" stroke="#762f29" stroke-width="25"
                    stroke-linejoin="round" />
                <path d="M213 144v-35q0-31 31-31h104" fill="none" stroke="#ed6548" stroke-width="15"
                    stroke-linejoin="round" />
                <path d="M194 476v102q0 28-28 28H90" fill="none" stroke="#23658f" stroke-width="23"
                    stroke-linejoin="round" />
                <path d="M194 476v102q0 28-28 28H90" fill="none" stroke="#24b8e5" stroke-width="13"
                    stroke-linejoin="round" />
                <!-- vessel -->
                <path d="M105 178Q105 137 154 128Q194 121 235 128Q284 137 284 178v275q0 44-45 54-41 8-89 0-45-10-45-54Z"
                    fill="url(#steel)" stroke="#566573" stroke-width="5" />
                <path d="M119 188q0-22 31-27 43-6 88 0 31 5 31 27v261q0 23-27 30-45 10-96 0-27-7-27-30Z"
                    fill="url(#water)" />
                <path id="water-rim" d="M119 188q0-22 31-27 43-6 88 0 31 5 31 27" fill="none" stroke="#1267df" stroke-width="4" />
                <path d="M140 482v29h16l7-26m71 0 7 26h16v-29" fill="#d6dee3" stroke="#566573" stroke-width="4"
                    stroke-linejoin="round" />
                <!-- sensor markers -->
                <circle cx="273" cy="183" r="14" class="sensor" stroke="#ed302b" />
                <path d="M287 183h43" stroke="#ed302b" stroke-width="4" />
                <circle cx="273" cy="449" r="14" class="sensor" stroke="#1267df" />
                <path d="M287 449h43" stroke="#1267df" stroke-width="4" />
                <!-- annotations --> 
                    <text x="352" y="61" class="pipe-label">To shower</text>
                    <g id="shower-ok" visibility="hidden" transform="translate(462 30)">
                        <title>Hot enough for a shower</title>
                        <circle cx="20" cy="20" r="21" fill="#e6f6ec" stroke="#16a36a" stroke-width="3" />
                        <path d="M9 12h12q7 0 7 7v2" fill="none" stroke="#566573" stroke-width="3" stroke-linecap="round" />
                        <path d="M21 21h14l-2 4H23Z" fill="#566573" />
                        <path d="M24 29l-1 4m5-4v4m5-4 1 4" stroke="#1d9bf0" stroke-width="2.5" stroke-linecap="round" />
                    </g>
                    <text x="340" y="181" id="top-temp" class="readout" fill="#e72f2c">--.-°C</text>
                    <text x="340" y="208" class="label">Outlet Temperature</text>
                    <text x="340" y="446" id="bottom-temp" class="readout" fill="#1267df">--.-°C</text>
                    <text x="340" y="473" class="label">Feed Temperature</text>
                    <text x="220" y="624" class="pipe-label">Cold Feed</text>
            </svg>
            <div class="foot"><span id="last">No reading received yet</span></div>
        </section>
        </div>
        <div id="view-history" class="view" hidden>
            <section class="card" aria-labelledby="history-title">
                <h2 id="history-title">Temperatures and Activity</h2>
                <div class="seg" role="group" aria-label="Time range">
                    <button type="button" data-range="3600">1h</button>
                    <button type="button" data-range="21600">6h</button>
                    <button type="button" data-range="86400">24h</button>
                    <button type="button" data-range="604800">7d</button>
                    <button type="button" data-range="2592000">30d</button>
                </div>
                <div id="hist-state" class="log-tools" role="status" aria-live="polite">Not loaded</div>
                <div id="hist-wrap"><svg id="hist-chart" role="img" aria-label="Temperature history chart"></svg></div>
                <div class="hist-legend"><span style="color:#e72f2c">Outlet (top)</span><span
                        style="color:#1267df">Feed (bottom)</span></div>
            </section>
        </div>
        <div id="view-logs" class="view" hidden>
            <section class="card" aria-labelledby="logs-title">
                <h2 id="logs-title">Logs</h2>
                <div class="log-tools"><span id="log-state" role="status" aria-live="polite">Not loaded</span><button
                        type="button" id="log-refresh">Refresh</button></div>
                <pre id="log-box"></pre>
            </section>
        </div>
    </main>
    <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-view="tank"><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-13Z" fill="currentColor" />
            </svg>Tank</button>
        <button type="button" role="tab" data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3v18h18M7 15l4-5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>History</button>
        <button type="button" role="tab" data-view="logs"><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2.4"
                    stroke-linecap="round" />
            </svg>Logs</button>
    </nav>
    <script>
        'use strict';
        const $ = id => document.getElementById(id), state = $('state'), dot = $('dot'), topOut = $('top-temp'), bottomOut = $('bottom-temp'), last = $('last');
        const T_MIN = 30, T_MAX = 60, T_SHOWER = 40, PALETTE = [[0, [18, 103, 223]], [1 / 6, [75, 187, 233]], [1 / 3, [255, 190, 80]], [2 / 3, [255, 118, 68]], [1, [240, 75, 54]]];
        const wStops = document.querySelectorAll('.wstop'), rim = $('water-rim'), showerOk = $('shower-ok');
        function tempColor(t) {
            const k = Math.min(1, Math.max(0, (t - T_MIN) / (T_MAX - T_MIN)));
            let i = 1; while (k > PALETTE[i][0]) i++;
            const [k0, a] = PALETTE[i - 1], [k1, b] = PALETTE[i], u = (k - k0) / (k1 - k0);
            return `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * u)).join()})`;
        }
        function paintTank(top, bottom) {
            wStops.forEach((s, i) => s.style.stopColor = tempColor(top + (bottom - top) * i / (wStops.length - 1)));
            rim.style.stroke = tempColor(top);
            showerOk.setAttribute('visibility', top >= T_SHOWER ? 'visible' : 'hidden');
        }
        async function refresh() { try { const r = await fetch('/api/temp', { cache: 'no-store', signal: AbortSignal.timeout(5000) }); if (!r.ok) throw Error('HTTP ' + r.status); const d = await r.json(); if (!Number.isFinite(d.tempTop) || !Number.isFinite(d.tempBottom)) throw Error('Unexpected response'); bottomOut.textContent = d.tempBottom.toFixed(1) + '°C'; topOut.textContent = d.tempTop.toFixed(1) + '°C'; paintTank(d.tempTop, d.tempBottom); dot.className = 'dot ok'; state.textContent = 'ESP32 reachable'; last.dataset.when = new Date().toLocaleTimeString(); last.textContent = 'Last reading: ' + last.dataset.when } catch (e) { dot.className = 'dot bad'; state.textContent = e.message === 'Unexpected response' ? 'Invalid sensor data' : 'ESP32 unreachable · waiting to reconnect'; last.textContent = 'Last successful reading: ' + (last.dataset.when || 'none yet') } }
        refresh(); setInterval(refresh, 10000);
        const tabs = document.querySelectorAll('.tabs button'), logBox = $('log-box'), logState = $('log-state'), logRefresh = $('log-refresh');
        async function fetchLog(url) { const r = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(5000) }); if (r.status === 404) return ''; if (!r.ok) throw Error('HTTP ' + r.status); return r.text() }
        async function loadLogs() {
            if (logRefresh.disabled) return;
            logRefresh.disabled = true; logState.textContent = 'Loading…';
            try {
                const [old, cur] = await Promise.all([fetchLog('/api/log?old=1'), fetchLog('/api/log')]);
                logBox.textContent = (old + cur) || 'No log entries yet';
                logBox.scrollTop = logBox.scrollHeight;
                logState.textContent = 'Updated ' + new Date().toLocaleTimeString();
            } catch (e) { logState.textContent = 'Could not load logs' }
            finally { logRefresh.disabled = false }
        }
        const TREND_WINDOW = 900, TREND_MIN_SPAN = 600, HEAT_RISE = 0.8, SHOWER_DROP = 1.5, BAND_MERGE = 600, MIN_BAND = 600, MAX_POINTS = 300, MIN_LABEL_PX = 8;
        // Day files are named in the ESP32's time zone, which may differ from the browser's by up to this many seconds.
        const DAY_SLACK = 43200;
        const histState = $('hist-state'), histWrap = $('hist-wrap'), histChart = $('hist-chart'), rangeBtns = document.querySelectorAll('.seg button'), dayCache = new Map();
        let histRange = 86400, histData = null, histLoading = false;
        const pad2 = n => String(n).padStart(2, '0'), dayKey = d => d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
        async function fetchDay(key) {
            if (dayCache.has(key)) return dayCache.get(key);
            const r = await fetch('/api/history?day=' + key, { cache: 'no-store', signal: AbortSignal.timeout(10000) }), out = [];
            if (r.status !== 404) {
                if (!r.ok) throw Error('HTTP ' + r.status);
                const v = new DataView(await r.arrayBuffer()), dec = x => x === -32768 ? NaN : x / 100;
                for (let o = 0; o + 8 <= v.byteLength; o += 8) out.push({ t: v.getUint32(o, true), top: dec(v.getInt16(o + 4, true)), bottom: dec(v.getInt16(o + 6, true)) });
            }
            if (key < dayKey(new Date(Date.now() - DAY_SLACK * 1000))) dayCache.set(key, out);
            return out;
        }
        async function loadHistory() {
            if (histLoading) return;
            histLoading = true;
            const range = histRange;
            for (const b of rangeBtns) b.classList.toggle('active', +b.dataset.range === range);
            try {
                const to = Math.floor(Date.now() / 1000), from = to - range, keys = [], samples = [], d = new Date((from - DAY_SLACK) * 1000);
                d.setHours(0, 0, 0, 0);
                while (d.getTime() / 1000 <= to + DAY_SLACK) { keys.push(dayKey(d)); d.setDate(d.getDate() + 1) }
                for (const [i, key] of keys.entries()) {
                    histState.textContent = `Loading… (${i + 1}/${keys.length})`;
                    for (const s of await fetchDay(key)) if (s.t >= from && s.t <= to) samples.push(s);
                }
                histData = { from, to, samples: samples.sort((a, b) => a.t - b.t) };
                histState.textContent = renderHistory() ? 'Updated ' + new Date().toLocaleTimeString() : 'No history recorded yet';
            } catch (e) { histState.textContent = 'Could not load history' }
            finally { histLoading = false }
            if (histRange !== range) loadHistory();
        }
        function detectBands(samples) {
            const pts = samples.filter(s => Number.isFinite(s.top)), raw = { heat: [], shower: [] }, bands = [];
            for (let i = 0, j = 0; i < pts.length; i++) {
                while (pts[j].t < pts[i].t - TREND_WINDOW) j++;
                if (pts[i].t - pts[j].t < TREND_MIN_SPAN) continue;
                const delta = pts[i].top - pts[j].top;
                if (delta >= HEAT_RISE) raw.heat.push([pts[j].t, pts[i].t]);
                else if (delta <= -SHOWER_DROP) raw.shower.push([pts[j].t, pts[i].t]);
            }
            for (const kind in raw) {
                let cur = null;
                for (const [start, end] of raw[kind]) {
                    if (cur && start <= cur.end + BAND_MERGE) cur.end = Math.max(cur.end, end);
                    else { if (cur) bands.push(cur); cur = { kind, start, end } }
                }
                if (cur) bands.push(cur);
            }
            return bands.filter(b => b.end - b.start >= MIN_BAND);
        }
        function renderHistory() {
            if (!histData || !histWrap.clientWidth) return true;
            const { from, to, samples } = histData, span = to - from, W = histWrap.clientWidth, H = 240, L = 34, R = 8, T = 22, B = 22;
            let min = Infinity, max = -Infinity;
            for (const s of samples) for (const v of [s.top, s.bottom]) if (Number.isFinite(v)) { if (v < min) min = v; if (v > max) max = v }
            if (min === Infinity) { histChart.innerHTML = ''; return false }
            const lo = Math.floor((min - 2) / 10) * 10, hi = Math.ceil((max + 2) / 10) * 10, yStep = hi - lo > 30 ? 10 : 5;
            const x = t => L + (t - from) / span * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B), f = n => n.toFixed(1);
            const txt = (tx, ty, s, anchor = 'middle', extra = '') => `<text x="${tx}" y="${ty}" text-anchor="${anchor}" ${extra}>${s}</text>`;
            const bucket = Math.max(60, Math.ceil(span / MAX_POINTS / 60) * 60), buckets = new Map();
            for (const s of samples) {
                const k = Math.floor((s.t - from) / bucket);
                let b = buckets.get(k);
                if (!b) buckets.set(k, b = { top: 0, nt: 0, bottom: 0, nb: 0 });
                if (Number.isFinite(s.top)) { b.top += s.top; b.nt++ }
                if (Number.isFinite(s.bottom)) { b.bottom += s.bottom; b.nb++ }
            }
            const points = [...buckets].sort((a, b) => a[0] - b[0]).map(([k, b]) => ({ t: Math.min(to, from + (k + .5) * bucket), top: b.nt ? b.top / b.nt : NaN, bottom: b.nb ? b.bottom / b.nb : NaN }));
            let grid = '', labels = txt(2, 12, '°C', 'start'), bandSvg = '', areas = '', strokes = '';
            for (let v = lo; v <= hi; v += yStep) { grid += `<path d="M${L} ${f(y(v))}H${W - R}"/>`; labels += txt(L - 6, f(y(v) + 4), v, 'end') }
            const ticks = [], d = new Date(from * 1000);
            d.setHours(0, 0, 0, 0);
            if (span <= 86400) {
                const step = span <= 3600 ? 900 : span <= 21600 ? 3600 : 21600, mid = d.getTime() / 1000;
                for (let t = mid + Math.ceil((from - mid) / step) * step; t <= to; t += step) ticks.push([t, new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })]);
            } else {
                const every = span <= 604800 ? 1 : 7, fmt = every === 1 ? { weekday: 'short' } : { day: 'numeric', month: 'numeric' };
                for (d.setDate(d.getDate() + 1); d.getTime() / 1000 <= to; d.setDate(d.getDate() + every)) ticks.push([d.getTime() / 1000, d.toLocaleDateString([], fmt)]);
            }
            for (const [t, s] of ticks) {
                const tx = x(t);
                grid += `<path d="M${f(tx)} ${T}V${H - B}"/>`;
                if (tx - L >= 18 && W - R - tx >= 18) labels += txt(f(tx), H - 6, s);
            }
            let labelEnd = -Infinity;
            for (const b of detectBands(samples).sort((p, q) => p.start - q.start)) {
                const x0 = x(Math.max(b.start, from)), x1 = x(Math.min(b.end, to)), heat = b.kind === 'heat', name = heat ? 'Heating' : 'Shower';
                bandSvg += `<rect x="${f(x0)}" y="${T}" width="${f(x1 - x0)}" height="${H - T - B}" fill="${heat ? '#16a36a' : '#f59e4b'}" fill-opacity="${heat ? .14 : .2}"/>`;
                const half = name.length * 3.4, cx = Math.min(Math.max((x0 + x1) / 2, L + half), W - R - half);
                if (x1 - x0 < MIN_LABEL_PX || cx - half < labelEnd + 4) continue;
                labels += txt(f(cx), 14, name, 'middle', `fill="${heat ? '#12844f' : '#d0701c'}" font-weight="600"`);
                labelEnd = cx + half;
            }
            for (const [key, color] of [['top', '#e72f2c'], ['bottom', '#1267df']]) {
                const runs = [];
                let run = [], prev = null;
                for (const p of points) {
                    if (!Number.isFinite(p[key]) || (prev && p.t - prev.t > 3 * bucket)) { if (run.length) runs.push(run); run = [] }
                    if (Number.isFinite(p[key])) run.push([f(x(p.t)), f(y(p[key]))]);
                    prev = p;
                }
                if (run.length) runs.push(run);
                for (const r of runs) {
                    if (r.length === 1) r.push(r[0]);
                    const line = 'M' + r.map(q => q.join(' ')).join('L');
                    areas += `<path d="${line}L${r[r.length - 1][0]} ${H - B}L${r[0][0]} ${H - B}Z" fill="url(#hg-${key})"/>`;
                    strokes += `<path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
                }
            }
            const grad = (id, c) => `<linearGradient id="${id}" x2="0" y2="1"><stop stop-color="${c}" stop-opacity=".18"/><stop offset="1" stop-color="${c}" stop-opacity=".02"/></linearGradient>`;
            histChart.setAttribute('viewBox', `0 0 ${W} ${H}`);
            histChart.innerHTML = `<defs>${grad('hg-top', '#e72f2c')}${grad('hg-bottom', '#1267df')}</defs>${bandSvg}<g stroke="#e8eef2">${grid}</g>${areas}${strokes}<g font-size="11" fill="#63778a">${labels}</g>`;
            return true;
        }
        for (const b of rangeBtns) b.addEventListener('click', () => { histRange = +b.dataset.range; for (const o of rangeBtns) o.classList.toggle('active', o === b); loadHistory() });
        window.addEventListener('resize', () => renderHistory());
        setInterval(() => { if (!$('view-history').hidden) loadHistory() }, 60000);
        function showTab(name) {
            for (const b of tabs) { const on = b.dataset.view === name; b.classList.toggle('active', on); b.setAttribute('aria-selected', on) }
            $('view-tank').hidden = name !== 'tank'; $('view-history').hidden = name !== 'history'; $('view-logs').hidden = name !== 'logs';
            history.replaceState(null, '', '#' + name);
            if (name === 'logs') loadLogs();
            if (name === 'history') loadHistory();
        }
        for (const b of tabs) b.addEventListener('click', () => showTab(b.dataset.view));
        logRefresh.addEventListener('click', loadLogs);
        showTab(['logs', 'history'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'tank');
    </script>
</body>
